<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آزمون آنلاین اطلاعات و اقدامات پنهان</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;padding:24px;
  font-family:"Vazirmatn",sans-serif;
  background:#0f172a;color:#eef2ff;
}
.card{
  max-width:900px;margin:auto;
  background:#111c33;border-radius:18px;
  padding:20px;box-shadow:0 14px 40px rgba(0,0,0,.45);
}
h1{font-size:20px;margin:0 0 10px}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;color:#b8c1e1}
.pill{background:#1b2a4d;padding:6px 12px;border-radius:999px}
.q{margin:18px 0 12px;font-size:18px;line-height:2}
.choices{display:grid;gap:10px}
.choice{
  border:1px solid rgba(255,255,255,.15);
  padding:12px;border-radius:14px;
  cursor:pointer;background:#0f1b34
}
.choice.correct{background:#1e3a2f;border-color:#2ecc71}
.choice.wrong{background:#3a1e1e;border-color:#e74c3c}
.actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
button{
  border:none;border-radius:12px;
  padding:10px 14px;cursor:pointer;
  background:#7aa2ff;color:#081020;
  font-family:inherit
}
button.secondary{background:#1b2a4d;color:#eef2ff}
button.danger{background:#e74c3c;color:#fff}
.result{margin-top:12px;font-size:14px}
.hidden{display:none}
</style>
</head>

<body>
<div class="card">
<h1>آزمون اطلاعات و اقدامات پنهان</h1>

<div class="meta">
  <div class="pill">⏱ زمان: <span id="time">15:00</span></div>
  <div class="pill">سؤال <span id="idx">1</span> / <span id="total"></span></div>
  <div class="pill">درست: <span id="ok">0</span></div>
  <div class="pill">غلط: <span id="bad">0</span></div>
</div>

<div class="q" id="qText"></div>
<div class="choices" id="choices"></div>

<div class="actions">
  <button id="check">ثبت پاسخ</button>
  <button class="secondary" id="next">بعدی</button>
  <button class="secondary" id="review">مرور غلط‌ها</button>
  <button class="danger" id="reset">شروع مجدد</button>
</div>

<div class="result" id="result"></div>
</div>

<script>
const QUESTIONS = [
{text:"بررسی اطلاعات به چه معناست؟",choices:[
"جمع‌آوری خام اخبار",
"تبدیل اطلاعات جمع‌آوری‌شده به مبنای تصمیم‌گیری سیاست‌گذاران و فرماندهان نظامی",
"بایگانی اسناد",
"انتقال اخبار"],correct:1},

{text:"خطرناک‌ترین رکن جاسوسی کدام است؟",choices:[
"طرح‌ریزی","انتخاب هدف","ارتباطات","حفاظت"],correct:2},

{text:"اطلاعات تاکتیکی چه ویژگی‌ای دارد؟",choices:[
"اثرگذاری بلندمدت سیاسی",
"پشتیبانی از عملیات واحدهای نظامی و اثر سریع بر مأموریت",
"تمرکز بر دیپلماسی",
"تحلیل رسانه"],correct:1},

{text:"کدام مورد نمونه عملیات پنهان است؟",choices:[
"جنگ آشکار",
"قتل کعب بن اشرف",
"مذاکره دیپلماتیک",
"تحریم اقتصادی"],correct:1},

{text:"هدف روش‌های فنی جمع‌آوری اطلاعات چیست؟",choices:[
"افزایش منابع انسانی",
"جایگزینی دانش فنی به جای منابع انسانی",
"تبلیغات",
"اطلاع‌رسانی عمومی"],correct:1},

{text:"مراحل بررسی اطلاعات کدام است؟",choices:[
"جمع‌آوری، انتشار، هشدار",
"تفکیک، تجزیه، ترکیب، بایگانی",
"نفوذ، ارتباط، خروج",
"شنود، رادار، حسگر"],correct:1},

{text:"نگاه بالگردی مربوط به چیست؟",choices:[
"جمع‌آوری رزمی",
"بررسی اطلاعاتی",
"شنود مخابراتی",
"حفاظت فیزیکی"],correct:1},

{text:"کدام گزینه جزء اطلاعات رزمی نیست؟",choices:[
"رادار","شنود مخابراتی","عناصر نفوذی","حسگرها"],correct:3},

{text:"جمع‌آوری آشکار اطلاعات چیست؟",choices:[
"اطلاعات مخفی",
"گردآوری از منابع آشکار و در دسترس",
"جاسوسی انسانی",
"نفوذ پنهان"],correct:1},

{text:"اولین و مهم‌ترین قدم سرویس‌های اطلاعاتی چیست؟",choices:[
"تحلیل","جمع‌آوری اطلاعات","انتشار","عملیات"],correct:1},

{text:"اصل انعطاف‌پذیری سازمان اطلاعاتی یعنی چه؟",choices:[
"ثبات کامل",
"تغییر متناسب با واقعیت‌ها",
"تمرکز بر گذشته",
"عدم تغییر"],correct:1},

{text:"کدام سازمان تدافعی است؟",choices:[
"CIA","KGB","FBI","MI6"],correct:2},

{text:"اهداف تشکیل سازمان‌های اطلاعاتی چیست؟",choices:[
"فقط جنگ",
"امنیت ملی و منافع کشور",
"تبلیغات",
"اقتصاد"],correct:1},

{text:"وزارت اطلاعات در چه سالی تشکیل شد؟",choices:[
"۱۳۵۷","۱۳۶۰","۱۳۶۲","۱۳۷۰"],correct:2},

{text:"اولین رئیس ساواک چه کسی بود؟",choices:[
"محمدرضا شاه",
"تیمور بختیار",
"نصیری",
"هویدا"],correct:1},

{text:"تقیه به چه معناست؟",choices:[
"اظهار آزاد عقیده",
"پرهیز از اظهار یا تظاهر برخلاف عقیده",
"تبلیغ سیاسی",
"جنگ نرم"],correct:1},

{text:"اطلاعات انسانی شامل چه چیزی است؟",choices:[
"رادار",
"جاسوسی",
"ماهواره",
"حسگر"],correct:1},

{text:"درجات اهمیت اطلاعات کدام‌اند؟",choices:[
"عمومی، محرمانه",
"راهبردی، عملیاتی، تاکتیکی",
"سیاسی، اقتصادی",
"داخلی، خارجی"],correct:1},

{text:"ارجحیت به چه معناست؟",choices:[
"صحت خبر",
"فوریت گزارش و اولویت اقدام",
"منبع خبر",
"محرمانگی"],correct:1},

{text:"خبر متواتر اجمالی چیست؟",choices:[
"خبر واحد",
"اخبار متفاوت با نتیجه مشترک",
"خبر جعلی",
"خبر فوری"],correct:1}
];

let order = QUESTIONS.map((_,i)=>i).sort(()=>Math.random()-0.5);
let i=0,ok=0,bad=0,selected=null;
const timeEl=document.getElementById("time");
let sec=15*60;

function tick(){
 if(sec<=0)return;
 sec--;
 let m=String(Math.floor(sec/60)).padStart(2,"0");
 let s=String(sec%60).padStart(2,"0");
 timeEl.textContent=m+":"+s;
}
setInterval(tick,1000);

const qText=document.getElementById("qText");
const choicesEl=document.getElementById("choices");
const idxEl=document.getElementById("idx");
const totalEl=document.getElementById("total");
const res=document.getElementById("result");

totalEl.textContent=QUESTIONS.length;

function render(){
 selected=null;
 res.textContent="";
 let q=QUESTIONS[order[i]];
 idxEl.textContent=i+1;
 qText.textContent=q.text;
 choicesEl.innerHTML="";
 q.choices.forEach((c,ci)=>{
   let d=document.createElement("div");
   d.className="choice";
   d.textContent=c;
   d.onclick=()=>{selected=ci;};
   choicesEl.appendChild(d);
 });
}
render();

document.getElementById("check").onclick=()=>{
 if(selected===null)return;
 let q=QUESTIONS[order[i]];
 let c=choicesEl.children;
 for(let j=0;j<c.length;j++){
   if(j===q.correct)c[j].classList.add("correct");
   if(j===selected && j!==q.correct)c[j].classList.add("wrong");
 }
 if(selected===q.correct){ok++;res.textContent="✅ درست";}
 else{bad++;res.textContent="❌ غلط";}
 document.getElementById("ok").textContent=ok;
 document.getElementById("bad").textContent=bad;
};

document.getElementById("next").onclick=()=>{
 if(i<order.length-1){i++;render();}
};

document.getElementById("reset").onclick=()=>location.reload();
</script>
</body>
</html>
